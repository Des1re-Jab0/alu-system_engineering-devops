<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1A2238;font-family:Arial,sans-serif;color:#fff}
h1{font-size:9rem;font-weight:800;letter-spacing:.2em;margin:0}
.tag{background:#FF6A3D;padding:0 .5rem;font-size:.875rem;border-radius:.25rem;transform:rotate(12deg);position:absolute}
p{margin:2.5rem 0 0;color:#cbd5e0}
a{position:relative;display:inline-block;margin-top:1.25rem;color:#FF6A3D;font-size:.875rem;font-weight:500;text-decoration:none}
a span{position:relative;display:block;padding:.75rem 2rem;background:#1A2238;border:1px solid currentColor}
a:before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:#FF6A3D;transform:translate(2px,2px);transition:transform .2s}
a:hover:before{transform:none}
</style>
</head>
<body>
<h1>404</h1>
<div class="tag">Page Not Found</div>
<p>Ceci n'est pas une page</p>
<a href="/"><span>Go Home</span></a>
</body>
</html>
